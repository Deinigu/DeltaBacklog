name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys or private data. For security problems use the private report link on the issue chooser page instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. A screenshot helps for UI problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the library on a phone
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release number, or the commit if you build from source.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Raspberry Pi (deploy script)
        - Downloaded binary
        - go run / built from source
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser and device
      placeholder: Chrome on Android 15, Safari on iPhone, Firefox on Windows...
  - type: textarea
    id: logs
    attributes:
      label: Server log output
      description: Relevant lines from the server log, if any.
      render: shell
